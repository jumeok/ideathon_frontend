<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/chat.css" />
    <title>AI 대화</title>
</head>
<body>
    <div class="screen">
        <!-- 상단 영역 -->
        <header>
            <button class="btn-back">
                <img src="../images/back.svg" alt="뒤로가기" />
            </button>
            <div class="progress-bar">
                <img src="../images/step4.svg" alt="progress-step4-img" />
            </div>
        </header>
    
        <!-- 타이틀 -->
        <section class="title-section">
            <h1 class="title">AI와 편하게<br>대화해보세요</h1>
            <p class="subtitle">간단한 대화로 성격을 파악합니다</p>
        </section>

        <!-- 인공지능 대화 -->
        <div class="chat-container" id="chatContainer"></div>
        
        <!-- 입력 영역 -->
        <div class="input-area">
            <p class="error-notice" id="errorNotice"></p>
            <div class="input-row">
                <input
                    type="text"
                    id="chatInput"
                    placeholder="대화를 시작해보세요"
                    autocomplete="off"
                    maxlength="200"
                />
                <button class="btn-send" id="sendBtn" disabled>
                    <img src="../images/send.svg" alt="보내기"/>
                </button>
            </div>
        </div>
    </div>

    <script src="../js/chat.js"></script>
</body>
</html>

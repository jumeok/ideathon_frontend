<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/partner.css" />
    <title>상대 선택</title>
</head>
<body>
    <div class="screen">
        <!-- 상단 영역 -->
        <header>
            <button class="btn-back">
                <img src="../images/back.svg" alt="뒤로가기" />
            </button>
            <div class="progress-bar">
                <img src="../images/step3.svg" alt="progress-step3-img" />
            </div>
        </header>
    
        <!-- 타이틀 -->
        <section class="title-section">
            <h1 class="title">원하는 상대의<br>키워드를 골라보세요</h1>
            <p class="subtitle">딱 맞는 상대를 매칭하는 데에 반영됩니다</p>
        </section>

        <!-- 키워드 목록 -->
        <section class="keyword-section">
            <div class="keyword-grid" id="keywordGrid">
                <!-- JS로 렌더링 -->
            </div>
        </section>

        <button class="btn-next" disabled>
            <img src="../images/next.svg" alt="다음" />
        </button>
    </div>

    <script src="../js/partner.js"></script>
</body>
</html>

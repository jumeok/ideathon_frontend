<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/personality.css" />
    <title>성향 테스트</title>
</head>
<body>
    <div class="screen">
        <!-- 상단 영역 -->
        <header>
            <div class="progress-bar">
                <img src="../images/step1.svg" alt="progress-step1-img" />
            </div>
        </header>
    
        <!-- 타이틀 -->
        <section class="title-section">
            <h1 class="title">내 성향에 가까운<br>선택지를 골라보세요</h1>
            <p class="subtitle">딱 맞는 상대를 매칭해드립니다</p>
        </section>

        <!-- 질문 영역 -->
      <section class="question">
        <h2>Q1. 여럿이 있는 자리에서 나는 보통?</h2>
        <button>먼저 말 걸고 분위기를 여는 편이다</button>
        <button>상황을 보다가 자연스럽게 끼는 편이다</button>
      </section>

      <section class="question">
        <h2>Q2. 여행을 갈 때 나는?</h2>
        <button>숙소, 동선, 맛집까지 미리 정리해두는 편이다</button>
        <button>그날그날 끌리는 대로 움직이는 편이다</button>
      </section>

      <section class="question">
        <h2>Q3. 쉬는 날의 나는?</h2>
        <button>사람들을 만나거나 밖에 나가는 게 좋다</button>
        <button>혼자 시간을 보내며 에너지를 회복한다</button>
      </section>

      <section class="question">
        <h2>Q4. 어떤 물건을 볼 때 나는?</h2>
        <button>실제로 얼마나 유용한지를 먼저 본다</button>
        <button>그 물건이 가진 컨셉이나 의미를 먼저 본다</button>
      </section>

      <section class="question">
        <h2>Q5. 논쟁 상황에서 나는?</h2>
        <button>감정보다 논리와 근거가 중요하다고 생각한다</button>
        <button>상대방이 상처받지 않는 방식이 중요하다고 생각한다</button>
      </section>

      <section class="question">
        <h2>Q6.  작업 스타일에서 나는?</h2>
        <button>정해진 방식과 루틴이 편하다</button>
        <button>상황에 따라 자유롭게 바꾸는 게 편하다</button>
      </section>

      <section class="question">
        <h2>Q7. 무언가를 배울 때 나는?</h2>
        <button>실전에서 바로 써먹을 수 있는 게 중요하다</button>
        <button>새로운 관점과 아이디어를 얻는 게 중요하다</button>
      </section>

      <section class="question">
        <h2>Q8.  중요한 결정을 할 때 나는?</h2>
        <button>객관적인 결과와 효율을 우선 고려한다</button>
        <button>사람들의 마음과 관계를 우선 고려한다</button>
      </section>

      <button id="nextButton" class="next-button" disabled>다음으로</button>
    </div>

    <script src="../js/personality.js"></script>
</body>
</html>
